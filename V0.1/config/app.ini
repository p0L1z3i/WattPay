# config/app.ini - WattPay Application Configuration
# This file centralizes configuration settings for the WattPay application.
# Environment variables can override any setting using the pattern APP_<SECTION>_<KEY>.

[DEFAULT]
name = WattPay
version = 0.0.1
environment = local

[logging]
level = INFO
file = build/logs/WattPay.log
console_output = true
file_output = true
format = %%(asctime)s - %%(name)s - %%(levelname)s - %%(filename)s - %%(funcName)s - %%(message)s
debug = false

[database]
host = localhost
port = 5432
name = watt_pay_db
username = postgres
password = 
ssl_mode = disable
pool_size = 4
pool_overflow = 20
pool_timeout = 30
connection_timeout = 30

[service]
host = localhost
port = 8000
